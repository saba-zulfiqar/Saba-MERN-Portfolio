<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Saba Zulfiqar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-body">

  <!-- Login card. Credentials come from ADMIN_USERNAME / ADMIN_PASSWORD in backend/.env -->
  <div class="login-card">
    <div class="login-logo"><i class="fas fa-lock"></i></div>
    <h1>Admin Login</h1>
    <p class="sub">
      Manage projects, skills &amp; about info.
      <a href="/">Back to site</a>
    </p>

    <form id="login-form" autocomplete="off">
      <div class="form-field" style="margin-bottom: 16px">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>

      <div class="form-field" style="margin-bottom: 22px">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" id="login-btn" style="width: 100%">
        <span>Sign In</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="alert error hidden" id="login-msg"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
